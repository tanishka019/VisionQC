# Warm paper + ink, with a dark sidebar and a lime accent. Fonts are served from ./static (see below).
[theme]
base = "light"
primaryColor = "#0e0e0e"
backgroundColor = "#ecebe6"
secondaryBackgroundColor = "#f7f6f2"
textColor = "#0e0e0e"
font = "sans serif"

[theme.sidebar]
backgroundColor = "#141414"
secondaryBackgroundColor = "#1d1d1d"
textColor = "#f3f2ee"
primaryColor = "#cbf55c"

[server]
enableStaticServing = true

[browser]
gatherUsageStats = false
